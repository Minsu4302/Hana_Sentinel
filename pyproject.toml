[project]
name = "sentinel-harness"
version = "0.0.0"
description = "폐쇄망 전용 AI 웹 취약점 점검 보조 — 분석 서버(Python 엔진)"
requires-python = ">=3.11"
# 제품 런타임 의존성. 외부 송신 라이브러리 추가 금지(N1/N2) — tests/test_egress.py가 전이 검사.
dependencies = [
    "fastapi==0.161.1",  # 수신 서버(송신 클라이언트 아님) — egress_static_check가 전이 폐포 검사
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
