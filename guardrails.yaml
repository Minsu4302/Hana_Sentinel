      - "tests/test_egress.py::test_local_llm_endpoint_needs_no_allowlist_entry"
      - "tests/test_egress.py::test_loopback_is_local_not_egress"
      - "tests/test_egress.py::test_non_loopback_or_disguised_hosts_are_external"
    manifest_key: local_llm_vs_egress
  - id: no_autonomous_send
