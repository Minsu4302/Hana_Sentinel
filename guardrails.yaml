# guardrails.yaml — 가드레일 기계 판독 SSOT (생성물: `make guardrails-sync`).
# 원천: (A) docs/design-decision.md §3 강제 매핑표 v1.3. 값이 다르면 (A)가 정본이다.
# 손으로 바꿔도 되는 것: (A)가 enforced를 목표로 둔 키의 실제 승격(state: enforced + verification_tests)뿐.
# enforced는 실제 통과 테스트가 있는 것만. 목표 주차 ≠ 현재 상태.
schema_version: "1"
derived_from: "docs/design-decision.md §3 매핑표 v1.3"
guardrails:
  - id: egress_static_check
    description: "egress 정적 의존성 0(외부 HTTP 송신 의존성 0 + 허용목록 빔)"
    target_layer: "테스트"
    week1_status:
      state: enforced
    verification_tests:
      - "tests/test_egress.py::test_product_runtime_dependencies_have_no_egress_library"
      - "tests/test_egress.py::test_rejects_planted_direct_egress_dependency"
      - "tests/test_egress.py::test_rejects_egress_library_reached_transitively"
      - "tests/test_egress.py::test_rejects_telemetry_exporter_reached_transitively"
      - "tests/test_egress.py::test_rejects_egress_library_pulled_in_by_requested_extra"
      - "tests/test_egress.py::test_unresolvable_dependency_is_an_error_not_a_pass"
      - "tests/test_egress.py::test_egress_allowlist_is_empty_and_immutable"
      - "tests/test_egress.py::test_non_empty_allowlist_would_permit_egress_so_it_must_stay_empty"
    manifest_key: egress_static_check
  - id: egress_runtime_block
    description: "egress 런타임 차단 실증"
    target_layer: "테스트"
    week1_status:
      state: enforced
      note: "테스트환경 한정"
    verification_tests:
      - "tests/test_egress.py::test_guard_is_installed_for_the_whole_test_session"
      - "tests/test_egress.py::test_external_tcp_connect_is_blocked_and_attributed_to_guard"
      - "tests/test_egress.py::test_external_raw_socket_connect_is_blocked"
      - "tests/test_egress.py::test_external_dns_resolution_is_blocked"
      - "tests/test_egress.py::test_external_udp_sendto_is_blocked"
      - "tests/test_egress.py::test_urllib_external_request_fails_because_of_guard_not_network"
      - "tests/test_egress.py::test_loopback_connection_is_allowed_as_control"
      - "tests/test_egress.py::test_unexpected_egress_outside_probe_is_flagged_as_real_event"
    manifest_key: egress_runtime_block
  - id: egress_enforcement_owner
    description: "egress 차단 실주체(OS/네트워크)"
    target_layer: "외부"
