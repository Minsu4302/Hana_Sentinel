// Sentinel Burp 확장 1부 — (A) §2.9, §3.1 java_build_egress.
// 의존성은 montoya-api(compileOnly)만이다. 툴체인·외부 플러그인·추가 저장소를 두지 않는다.
// 빌드 JDK는 21, 바이트코드 대상은 Java 17이다(options.release).
plugins {
    id 'java'
}

version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2024.12'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
